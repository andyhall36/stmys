<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3;url=https://www.netflix.com/">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Netflix - Payment Processing</title>
    <style>
        :root {
            --nf-red: #E50914;
            --nf-black: #000;
            --nf-dark: #141414;
            --nf-gray: #808080;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Netflix Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        
        body {
            background: var(--nf-black);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .loading-card {
            text-align: center;
            max-width: 500px;
            width: 90%;
            padding: 40px 30px;
            background: var(--nf-dark);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        
        .netflix-logo {
            width: clamp(60px, 15vw, 80px);
            margin-bottom: 30px;
            filter: drop-shadow(0 0 12px rgba(229, 9, 20, 0.2));
        }
        
        .status-text {
            font-size: clamp(1.1rem, 4vw, 1.3rem);
            color: #fff;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        
        .wait-message {
            color: var(--nf-gray);
            font-size: clamp(0.9rem, 3vw, 1rem);
            margin-bottom: 30px;
        }
        
        @media (max-width: 480px) {
            .loading-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>
